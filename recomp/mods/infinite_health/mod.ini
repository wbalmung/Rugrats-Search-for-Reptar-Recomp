; Example mod for the Rugrats native port. Format: recomp/MODDING.md.
[mod]
name=Infinite Health
version=1.0
author=Rugrats recomp project
description=Keeps the player's health full in every level. Example of a [ram] mod.
api=1

[ram]
; <when> <address> <type> <value>
; Player health: object 0x800E2B48 + 0x1A4, 0..255.
always 800E2CEC u16 255
