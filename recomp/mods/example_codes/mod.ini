; Example mod: the same idea as GameShark codes (one code per line, as on a cheat cartridge).
[mod]
name=Example GameShark Codes
version=1.0
author=Rugrats recomp project
description=Refills health to full whenever it drops below 64. Shows a conditional code (D2) guarding a write (80).
api=1

[gameshark]
D20E2CEC 0040 ; if health < 64 ...
800E2CEC 00FF  ; ... set it to 255
